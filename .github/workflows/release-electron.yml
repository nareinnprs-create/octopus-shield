# HR1: all release artifacts built on CI. Dispatch-only electron packaging
# for the slices release-cut.yml does not build itself (win NSIS + linux trio).
# mac is covered by release-mac-build.yml.
name: Electron packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/SHA to package (default main)'
        required: false
        default: main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install mobile workspace deps (mobile-web bundle stage needs react-native-web)
        run: pnpm --dir mobile install --frozen-lockfile
      - name: Build Windows installer (NSIS)
        run: pnpm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shield-windows-setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install mobile workspace deps (mobile-web bundle stage needs react-native-web)
        run: pnpm --dir mobile install --frozen-lockfile
      - name: Build Linux packages (AppImage/deb/rpm)
        run: pnpm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shield-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 14
